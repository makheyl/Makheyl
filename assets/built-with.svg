MAKHEYL / built-with chart. Hand-maintained.
Counts projects on makheyl-portfolio.vercel.app/projects.html whose
"built with" list includes the tool (12 of 13 list a stack; Dust & Shine
does not). This replaces a bytes-of-code language card, which reported
the profile as mostly HTML.
  JavaScript: 6 (JobMatch, OPD Queue, Lab Queue, SHHKOOL, Terraqua Clash, Bayanihan)
  TypeScript: 3 (KolektaPH, JobMatch, Folio)
  Supabase: 3 (KolektaPH, JobMatch, Bayanihan)
  React / React Native: 3 (KolektaPH, Folio, StudyBudget)
  Tailwind CSS: 3 (Folio, Music Mixer, StudyBudget)
  PHP + MySQL: 2 (OPD Queue, Lab Queue)
  Python: 2 (Music Mixer, PennyWise AI)
  Canvas 2D: 2 (Terraqua Clash, Bayanihan)
-->
