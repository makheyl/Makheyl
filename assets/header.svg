<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Makheyl: independent builder, SaaS for startups and competitions, BSIT game dev">
<!--
MAKHEYL / header card. Pure SVG, no external fonts or images.
Cursor blink and the white grid cells' pulse are CSS animations, which
GitHub keeps when it serves an SVG as an image.
-->
  <title>Makheyl: independent builder, SaaS for startups and competitions, BSIT game dev</title>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="#000000" stroke="#262626"/>
  <style>
    .cur { animation: blink 1.1s steps(1) infinite; }
    .p { animation: pulse 3.2s ease-in-out infinite; }
    .p:nth-of-type(2n) { animation-delay: 1.1s; }
    .p:nth-of-type(3n) { animation-delay: 2.2s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  </style>
  <circle cx="30" cy="28" r="5" fill="#262626"/>
